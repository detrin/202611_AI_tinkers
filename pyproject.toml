[project]
name = "202611-ai-tinkers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.5,<5",
    "apify-client>=3.5.1",
    "fastapi>=0.162.6",
    "httpx>=0.28.1,<1",
    "icalendar>=6,<8",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mcp>=1.26,<2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "openai>=3.50.0",
    "pillow>=13.0.0",
    "pydantic-ai-slim[openai]>=2.68.0",
    "python-multipart>=0.0.33",
    "recurring-ical-events>=3.4,<4",
    "requests>=2.34.2",
    "supabase>=2.34.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
